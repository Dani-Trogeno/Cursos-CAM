name: Inscribir en curso MOC

# Se lanza cuando confirmas en un issue de "solicitud-inscripcion":
#   - poniéndole la etiqueta "inscribir", o
#   - escribiendo un comentario que empiece por "inscribir" (solo cuenta el dueño del repositorio).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: inscribir-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  inscribir:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'solicitud-inscripcion') &&
      !contains(github.event.issue.labels.*.name, 'inscrito') &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'inscribir') ||
        (github.event_name == 'issue_comment' &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.comment.body, 'inscribir'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inscribir a la cuenta de prueba
        id: inscribir
        continue-on-error: true
        env:
          CAM_USUARIO: ${{ secrets.CAM_USUARIO }}
          CAM_PASSWORD: ${{ secrets.CAM_PASSWORD }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_PASSWORD: ${{ secrets.CORREO_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python buscar_cursos.py --inscribir-desde-issue

      - name: Comentar el resultado en el issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -f resultado.md ] || echo "❌ Falló la inscripción; mira el registro de la ejecución." > resultado.md
          printf '\n\n[Registro de la ejecución](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> resultado.md
          gh issue comment "$NUM" --body-file resultado.md
          if [ "${{ steps.inscribir.outcome }}" = "success" ]; then
            gh issue edit "$NUM" --add-label inscrito
            gh issue close "$NUM" --reason completed
          fi

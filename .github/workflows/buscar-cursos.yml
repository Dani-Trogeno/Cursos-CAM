name: Buscar cursos MOC

on:
  schedule:
    # Todos los días a las 06:47 UTC (07:47 en invierno / 08:47 en verano, hora de Madrid)
    - cron: "47 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar-cursos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar cursos MOC
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          AVISO_DIAS_ANTES: ${{ vars.AVISO_DIAS_ANTES || '3' }}
          AVISO_DIAS_CIERRE: ${{ vars.AVISO_DIAS_CIERRE || '2' }}
        run: python buscar_cursos.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cursos_moc.json CURSOS.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar cursos MOC ($(date -u +%F))"
            git push
          fi

      - name: Avisar de cursos nuevos (issue)
        if: hashFiles('nuevos.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cursos-moc --color 1d76db --description "Avisos de cursos MOC" 2>/dev/null || true
          gh issue create \
            --title "Cursos MOC nuevos – $(TZ=Europe/Madrid date +%d/%m/%Y)" \
            --body-file nuevos.md \
            --label cursos-moc \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create \
            --title "Cursos MOC nuevos – $(TZ=Europe/Madrid date +%d/%m/%Y)" \
            --body-file nuevos.md \
            --label cursos-moc

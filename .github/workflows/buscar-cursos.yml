name: Buscar cursos MOC

on:
  schedule:
    # Todos los días a las 11:00 hora de Madrid. GitHub usa UTC, así que se lanza
    # a las 09:00 y 10:00 UTC y el script descarta la que no corresponde
    # (invierno: 10:00 UTC = 11:00 Madrid; verano: 09:00 UTC = 11:00 Madrid).
    - cron: "0 9,10 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo enviar un correo de prueba"
        type: boolean
        default: false
      probar_login:
        description: "Solo comprobar el inicio de sesión con la cuenta de prueba"
        type: boolean
        default: false
      diagnostico:
        description: "(Con probar_login) describir el formulario de inscripción, sin enviar nada"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: buscar-cursos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Notificación de prueba
        if: inputs.prueba
        env:
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_PASSWORD: ${{ secrets.CORREO_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
        run: python buscar_cursos.py --prueba

      - name: Comprobar inicio de sesión
        if: inputs.probar_login
        env:
          CAM_USUARIO: ${{ secrets.CAM_USUARIO }}
          CAM_PASSWORD: ${{ secrets.CAM_PASSWORD }}
        run: python buscar_cursos.py --login ${{ inputs.diagnostico && '--diagnostico' || '' }}

      - name: Buscar cursos MOC
        if: ${{ !inputs.prueba && !inputs.probar_login }}
        env:
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_PASSWORD: ${{ secrets.CORREO_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          AVISO_DIAS_ANTES: ${{ vars.AVISO_DIAS_ANTES || '3' }}
          AVISO_DIAS_CIERRE: ${{ vars.AVISO_DIAS_CIERRE || '2' }}
          HORA_EJECUCION: ${{ github.event_name == 'schedule' && '11' || '' }}
          # Inscripción automática en los MOC que encajan (formato ✅ + perfil ✅).
          # Para desactivarla: variable de repositorio INSCRIPCION_AUTOMATICA = false
          INSCRIPCION_AUTOMATICA: ${{ vars.INSCRIPCION_AUTOMATICA || 'true' }}
          CAM_USUARIO: ${{ secrets.CAM_USUARIO }}
          CAM_PASSWORD: ${{ secrets.CAM_PASSWORD }}
        run: python buscar_cursos.py

      - name: Guardar estado
        if: ${{ !inputs.prueba && !inputs.probar_login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cursos_moc.json CURSOS.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar cursos MOC ($(date -u +%F))"
            git push
          fi

      - name: Registrar inscripciones automáticas (issue cerrado por curso)
        if: ${{ !inputs.prueba && !inputs.probar_login && hashFiles('inscritos.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create inscrito --color 5319e7 --description "Inscripción realizada" 2>/dev/null || true
          gh label create inscripcion-automatica --color c2e0c6 --description "Inscrito automáticamente" 2>/dev/null || true
          n=$(python -c "import json;print(len(json.load(open('inscritos.json'))))")
          for i in $(seq 0 $((n-1))); do
            titulo=$(python -c "import json;print(json.load(open('inscritos.json'))[$i]['titulo'])")
            python -c "import json;print(json.load(open('inscritos.json'))[$i]['cuerpo'])" > cuerpo.md
            url=$(gh issue create --title "✅ Inscrito automáticamente: $titulo" --body-file cuerpo.md \
                    --label inscrito --label inscripcion-automatica)
            gh issue close "$url" --reason completed
            echo "Registrado $url"
          done

      - name: Pedir confirmación de inscripción (un issue por curso)
        if: ${{ !inputs.prueba && !inputs.probar_login && hashFiles('solicitudes.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_PASSWORD: ${{ secrets.CORREO_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
        run: |
          gh label create solicitud-inscripcion --color fbca04 --description "Pendiente de confirmar inscripción" 2>/dev/null || true
          gh label create inscribir --color 0e8a16 --description "Confirma la inscripción en el curso" 2>/dev/null || true
          gh label create inscrito --color 5319e7 --description "Inscripción realizada" 2>/dev/null || true
          n=$(python -c "import json;print(len(json.load(open('solicitudes.json'))))")
          for i in $(seq 0 $((n-1))); do
            titulo=$(python -c "import json,sys;print(json.load(open('solicitudes.json'))[$i]['titulo'])")
            python -c "import json;print(json.load(open('solicitudes.json'))[$i]['cuerpo'])" > cuerpo.md
            url=$(gh issue create --title "📝 ¿Inscribir en: $titulo?" --body-file cuerpo.md \
                    --label solicitud-inscripcion --assignee "${{ github.repository_owner }}" \
                  || gh issue create --title "📝 ¿Inscribir en: $titulo?" --body-file cuerpo.md \
                    --label solicitud-inscripcion)
            echo "Creado $url"
            python buscar_cursos.py --avisar-solicitud "$titulo" "$url"
          done

      - name: Avisar de cursos nuevos (issue)
        if: ${{ !inputs.prueba && !inputs.probar_login && hashFiles('nuevos.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cursos-moc --color 1d76db --description "Avisos de cursos MOC" 2>/dev/null || true
          gh issue create \
            --title "Cursos MOC nuevos – $(TZ=Europe/Madrid date +%d/%m/%Y)" \
            --body-file nuevos.md \
            --label cursos-moc \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create \
            --title "Cursos MOC nuevos – $(TZ=Europe/Madrid date +%d/%m/%Y)" \
            --body-file nuevos.md \
            --label cursos-moc
